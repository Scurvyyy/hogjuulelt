apiVersion: apps/v1
kind: Deployment
metadata:
  name: hogjuulelt
  labels:
    app: hogjuulelt
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hogjuulelt
  template:
    metadata:
      labels:
        app: hogjuulelt
    spec:
      containers:
        - name: hogjuulelt
          image: hogjuulelt:1.0
          # Image is built into Minikube's Docker daemon, so never pull
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
